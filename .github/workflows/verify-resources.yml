# Fork-only verification of the resources/maxmemory defaults. Not for upstream.
name: Verify resources defaults (fork)
on:
  push:
    branches: [resources-defaults-verify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        chart: [main, fix]
    name: measure (${{ matrix.chart }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The chart from upstream main
        if: matrix.chart == 'main'
        run: |
          git remote add upstream https://github.com/valkey-io/valkey-helm
          git fetch -q upstream main
          git checkout upstream/main -- valkey
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind
      - name: Install with the chart's defaults
        run: |
          helm install vk ./valkey -n valkey --create-namespace --wait --timeout 5m
          kubectl -n valkey get pod -o jsonpath='{range .items[*]}{.metadata.name} qos={.status.qosClass}{"\n"}{range .spec.initContainers[*]}  init {.name}: {.resources}{"\n"}{end}{range .spec.containers[*]}  {.name}: {.resources}{"\n"}{end}{end}'
      - name: Memory, idle and loaded
        run: |
          set -euo pipefail
          p=$(kubectl -n valkey get pod -o name | head -1)
          mem() {
            echo "--- $1"
            kubectl -n valkey exec $p -c valkey -- valkey-cli INFO memory | grep -E '^(used_memory_human|used_memory_peak_human|maxmemory_human|maxmemory_policy):' | tr -d '\r'
            echo "cgroup memory.current: $(kubectl -n valkey exec $p -c valkey -- cat /sys/fs/cgroup/memory.current | awk '{printf "%.1f MiB", $1/1048576}')"
          }
          mem idle
          kubectl -n valkey exec $p -c valkey -- valkey-benchmark -q -t set -n 200000 -r 200000 -d 512 -P 16 | tail -1
          kubectl -n valkey exec $p -c valkey -- valkey-cli DBSIZE
          mem "after 200000 keys of 512 bytes"
      - name: Overfill past maxmemory (fix only)
        if: matrix.chart == 'fix'
        run: |
          # OOM error replies are the expected outcome here, not a failure.
          set +e
          p=$(kubectl -n valkey get pod -o name | head -1)
          kubectl -n valkey exec $p -c valkey -- valkey-benchmark -q -t set -n 1500000 -r 3000000 -d 512 -P 16 2>&1 | tail -2
          echo "--- after overfill"
          kubectl -n valkey exec $p -c valkey -- valkey-cli INFO memory | grep -E '^(used_memory_human|maxmemory_human):' | tr -d '\r'
          echo "cgroup memory.current: $(kubectl -n valkey exec $p -c valkey -- cat /sys/fs/cgroup/memory.current | awk '{printf "%.1f MiB", $1/1048576}')"
          echo "cgroup memory.events: $(kubectl -n valkey exec $p -c valkey -- cat /sys/fs/cgroup/memory.events | tr '\n' ' ')"
          echo "one more SET: $(kubectl -n valkey exec $p -c valkey -- valkey-cli SET one-more value 2>&1)"
          echo "restarts: $(kubectl -n valkey get $p -o jsonpath='{.status.containerStatuses[0].restartCount}') lastState: $(kubectl -n valkey get $p -o jsonpath='{.status.containerStatuses[0].lastState}')"
      - name: helm test
        run: helm test vk -n valkey --timeout 5m

  bgsave-cow:
    # Worst case for the memory limit: a dataset just under maxmemory, a
    # background save, and every key overwritten while it runs, so each page
    # is copied once. rdb-key-save-delay stretches the save so the overwrites
    # land inside it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults 512Mi-192mb
            set: ""
          - name: documented 2Gi-900mb
            set: "--set resources.limits.memory=2Gi --set maxmemory=900mb"
    name: bgsave-cow (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind
      - name: Install
        run: |
          helm install vk ./valkey -n valkey --create-namespace --wait --timeout 5m ${{ matrix.set }}
          kubectl -n valkey get pod -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.name}: {.resources}{"\n"}{end}{end}'
      - name: Fill, save, overwrite during the save
        run: |
          set +e
          P=$(kubectl -n valkey get pod -o name | head -1)
          cli() { kubectl -n valkey exec $P -c valkey -- valkey-cli "$@" | tr -d '\r'; }
          field() { cli INFO "$1" | grep -E "^$2:" | cut -d: -f2; }
          pipe() { kubectl -n valkey exec -i $P -c valkey -- valkey-cli --pipe; }
          gen() { python3 -I -c '
          import sys
          start, count, tag = int(sys.argv[1]), int(sys.argv[2]), sys.argv[3]
          out = sys.stdout.buffer
          for i in range(start, start + count):
              k = b"key:%d" % i
              v = (tag.encode() * 512)[:512]
              out.write(b"*3\r\n$3\r\nSET\r\n$%d\r\n%s\r\n$512\r\n%s\r\n" % (len(k), k, v))
          ' "$@"; }
          echo "save config: $(cli CONFIG GET save | tail -1)"
          max=$(cli CONFIG GET maxmemory | tail -1)
          echo "maxmemory: $max"
          n=0
          while :; do
            left=$((max * 99 / 100 - $(field memory used_memory)))
            [ $left -gt 0 ] && [ $n -lt 4000000 ] || break
            c=$((left / 800)); [ $c -lt 1000 ] && c=1000
            gen $n $c a | pipe | tail -1
            n=$((n + c))
          done
          echo "filled: $n keys, used_memory $(field memory used_memory_human)"
          kubectl -n valkey exec $P -c valkey -- sh -c 'echo "cgroup before save: current $(cat /sys/fs/cgroup/memory.current) peak $(cat /sys/fs/cgroup/memory.peak)"'
          gen 0 $n b > /tmp/over-b; gen 0 $n c > /tmp/over-c
          cli CONFIG SET rdb-key-save-delay 50
          kubectl -n valkey exec $P -c valkey -- sh -c '
            mx=0; ma=0; i=0
            while [ $i -lt 1500 ]; do
              c=$(cat /sys/fs/cgroup/memory.current)
              a=$(grep "^anon " /sys/fs/cgroup/memory.stat | cut -d" " -f2)
              [ "$c" -gt $mx ] && mx=$c; [ "$a" -gt $ma ] && ma=$a
              i=$((i + 1)); sleep 0.1
            done
            echo "sampled max during save: current $((mx / 1048576)) MiB, anon $((ma / 1048576)) MiB"' > /tmp/samples 2>&1 &
          sampler=$!
          sleep 1
          cli BGSAVE
          pass=0
          while [ "$(field persistence rdb_bgsave_in_progress)" = 1 ] && [ $pass -lt 20 ]; do
            if [ $((pass % 2)) = 0 ]; then f=/tmp/over-b; else f=/tmp/over-c; fi
            pipe < $f | tail -1
            pass=$((pass + 1))
          done
          echo "overwrite passes during the save: $pass"
          while [ "$(field persistence rdb_bgsave_in_progress)" = 1 ]; do sleep 1; done
          wait $sampler; cat /tmp/samples
          echo "--- after"
          cli INFO persistence | grep -E '^(rdb_last_bgsave_status|rdb_last_cow_size|rdb_last_bgsave_time_sec):'
          echo "used_memory: $(field memory used_memory_human)"
          kubectl -n valkey exec $P -c valkey -- sh -c 'echo "cgroup peak $(($(cat /sys/fs/cgroup/memory.peak) / 1048576)) MiB, max $(cat /sys/fs/cgroup/memory.max), events: $(tr "\n" " " < /sys/fs/cgroup/memory.events)"'
          echo "restarts: $(kubectl -n valkey get $P -o jsonpath='{.status.containerStatuses[0].restartCount}') lastState: $(kubectl -n valkey get $P -o jsonpath='{.status.containerStatuses[0].lastState}')"

  cnti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # v1.4.0
        with:
          version: v2.4.1
          cnf_config: .github/cnti/cnti-testsuite.yaml
          tests: cert
          fail_on_failure: "false"

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4
      - name: values.schema.json as `just schema` writes it
        run: |
          helm plugin install https://github.com/losisin/helm-values-schema-json
          helm plugin list
          cd valkey && helm schema && cd ..
          git diff --stat valkey/values.schema.json
          git diff valkey/values.schema.json
          git diff --quiet valkey/values.schema.json && echo "committed schema matches helm schema output"
      - uses: actions/upload-artifact@v4
        with:
          name: values-schema
          path: valkey/values.schema.json
          retention-days: 3
  helm-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: README as helm-docs v1.14.2 writes it
        run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2 --chart-search-root valkey
          git diff --stat valkey/README.md
          git diff --exit-code valkey/README.md && echo "README matches helm-docs"
